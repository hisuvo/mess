root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Build the Go application.
  cmd = "go build -o ./tmp/main.exe ./cmd/server"

  # Binary generated by the build command.
  bin = "./tmp/main.exe"

  # Run the binary with arguments if needed.
  full_bin = "./tmp/main.exe"

  # Delay before rebuilding after a file change.
  delay = 1000

  # Directories that should NOT trigger a rebuild.
  exclude_dir = ["assets", "tmp", "vendor", "testdata"]

  # Files/directories to include.
  include_dir = ["cmd", "internal", "config"]

  # File extensions that trigger rebuild.
  include_ext = ["go", "tpl", "tmpl", "html"]

  # Files to exclude.
  exclude_file = []

  # Regex patterns for excluding files.
  exclude_regex = ["_test.go"]

  # Stop Air if build fails.
  stop_on_error = true

  # Send interrupt signal before killing the process.
  send_interrupt = true

  # Time to wait before force killing the process.
  kill_delay = "500ms"

[log]
  # Show timestamps in logs.
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Clean temporary files when Air exits.
  clean_on_exit = true